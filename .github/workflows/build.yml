name: 编译通话录音机 IPA (巨魔可用)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest       # GitHub 托管 macOS runner，通用可用
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate --spec project.yml

      - name: 编译（不签名，签名在下一步统一做）
        run: |
          xcodebuild clean archive \
            -project CallRecorder.xcodeproj \
            -scheme CallRecorder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/CallRecorder.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CLANG_ENABLE_MODULES=NO \
            OTHER_LDFLAGS='-framework AudioToolbox -framework AVFoundation -framework CoreTelephony -framework CallKit -framework UserNotifications -framework CoreGraphics -framework Speech -framework Foundation -framework UIKit'

      - name: 打包 + ad-hoc 签名（带私有权限 entitlements）
        run: |
          mkdir -p build/Payload
          # 动态定位归档里的 .app（PRODUCT_NAME 是中文，名字不固定）
          APP=$(find "$PWD/build/CallRecorder.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)
          echo "找到 App: $APP"
          cp -R "$APP" build/Payload/
          APPNAME=$(basename "$APP")
          # 用 ad-hoc 签名并嵌入 entitlements —— 巨魔安装时靠 CoreTrust 漏洞坐实这些权限
          codesign --force --deep --sign - --timestamp=none \
            --entitlements CallRecorder/CallRecorder.entitlements \
            "build/Payload/$APPNAME"
          # 验证签名与权限是否真正嵌入
          echo "=== 签名验证 ==="
          codesign -dv "build/Payload/$APPNAME" 2>&1 | head -20 || true
          echo "=== 嵌入的 entitlements ==="
          codesign -d --entitlements :- "build/Payload/$APPNAME" 2>/dev/null || echo "(无法读取 entitlements)"
          cd build
          zip -qry CallRecorder.ipa Payload
          echo "IPA 大小："
          ls -lh CallRecorder.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-IPA
          path: build/CallRecorder.ipa
          if-no-files-found: error
          retention-days: 30
