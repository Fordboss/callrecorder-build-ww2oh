name: CallRecorder

options:
  bundleIdPrefix: com.wb
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  PRODUCT_NAME: CallRecorder
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  TARGETED_DEVICE_FAMILY: "1"
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "NO"
  GENERATE_INFOPLIST_FILE: "NO"
  CLANG_ENABLE_MODULES: "NO"
  CLANG_ENABLE_OBJC_ARC: "YES"
  SDKROOT: iphoneos

targets:
  CallRecorder:
    type: application
    platform: iOS
    sources:
      - path: CallRecorder
    settings:
      INFOPLIST_FILE: CallRecorder/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.wb.callrecorder
      CODE_SIGN_ENTITLEMENTS: CallRecorder/CallRecorder.entitlements
    frameworks:
      - SDK: AudioToolbox.framework
      - SDK: AVFoundation.framework
      - SDK: CoreTelephony.framework
      - SDK: Foundation.framework
      - SDK: UIKit.framework
